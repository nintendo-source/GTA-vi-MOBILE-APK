name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Godot 4.7-dev1 and templates
        run: |
          mkdir -p /tmp/godot ~/.local/share/godot/export_templates/4.7.dev1
          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/4.7-dev1/Godot_v4.7-dev1_linux.x86_64.zip" -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v*_linux* /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/4.7-dev1/Godot_v4.7-dev1_export_templates.tpz" -o /tmp/godot/templates.tpz
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot/templates
          mv /tmp/godot/templates/templates/* ~/.local/share/godot/export_templates/4.7.dev1/

      - name: Import assets
        run: godot --headless --editor --quit --path . || true

      - name: Export APK
        run: |
          mkdir -p out
          godot --headless --path . --export-debug "Android" out/game.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/game.apk
